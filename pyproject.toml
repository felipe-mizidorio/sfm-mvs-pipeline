[project]
name = "sfm-mvs-pipeline"
version = "0.1.0"
description = "A pipeline for Structure from Motion and Multi-View Stereo"
authors = [
    {name = "Felipe Merenda Izidorio",email = "felipemerenda1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pycolmap (>=4.0.3,<5.0.0)",
    "open3d (>=0.19.0,<0.20.0)",
    "opencv-contrib-python (>=4.13.0.92,<5.0.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "plotly (>=6.7.0,<7.0.0)"
]

[project.scripts]
sfm-mvs-run = "sfm_mvs_pipeline.cli.run:main"
sfm-mvs-resume-mvs = "sfm_mvs_pipeline.cli.resume_mvs:main"
sfm-mvs-resume-dense = "sfm_mvs_pipeline.cli.resume_dense:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sfm_mvs_pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
gpu = [
    "pycolmap-cuda12 (>=4.0.3,<5.0.0)"
]
dev = [
    "ruff (>=0.15.12,<0.16.0)",
    "pyright (>=1.1.409,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "nbstripout (>=0.9.1,<0.10.0)",
    "pre-commit (>=4.0.0,<5.0.0)"
]
notebook = [
    "jupyterlab (>=4.5.6,<5.0.0)"
]
